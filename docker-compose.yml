services:
  # PostgreSQL Database
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: dating_app_db
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network

  # Redis for Caching and Queues
  redis:
    image: redis:7-alpine
    container_name: dating_app_redis
    restart: always
    env_file: .env
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

  # MinIO for Object Storage (S3 compatible)
  minio:
    image: minio/minio:latest
    container_name: dating_app_minio
    restart: always
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    name: dating_app_postgres_data
  redis_data:
    name: dating_app_redis_data
  minio_data:
    name: dating_app_minio_data
